name: Clanker Submission Pipeline

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-submission:
    name: Process Clanker Submission
    runs-on: ubuntu-latest
    # Only run on issues with clanker labels
    if: |
      contains(github.event.issue.labels.*.name, 'clanker-feature') ||
      contains(github.event.issue.labels.*.name, 'clanker-fix') ||
      contains(github.event.issue.labels.*.name, 'clanker-chore')
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Parse Issue Content
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const labels = issue.labels.map(l => l.name);
            
            console.log('Issue body:', body);
            console.log('Labels:', labels);
            
            // Determine submission type
            let submissionType = '';
            if (labels.includes('clanker-feature')) {
              submissionType = 'feature';
            } else if (labels.includes('clanker-fix')) {
              submissionType = 'fix';
            } else if (labels.includes('clanker-chore')) {
              submissionType = 'chore';
            }
            
            core.setOutput('submission_type', submissionType);
            
            // Parse fields from issue body
            const parseField = (fieldName) => {
              const patterns = [
                new RegExp(`### ${fieldName}\\s*\\n\\n([^#]*?)(?=\\n\\n###|$)`, 's'),
                new RegExp(`### ${fieldName}\\s*\\n([^#]*?)(?=\\n###|$)`, 's')
              ];
              
              for (const regex of patterns) {
                const match = body.match(regex);
                if (match) {
                  return match[1].trim();
                }
              }
              return '';
            };
            
            // Extract required fields based on type
            const description = parseField('Feature Description') || 
                              parseField('Bug Description') || 
                              parseField('Chore Description');
            const changelog = parseField('Changelog Entry');
            const version = parseField('Semantic Version');
            const testing = parseField('Testing Plan') || 
                           parseField('Testing Verification') || 
                           parseField('Testing/Validation');
            
            // For features, check breaking changes
            const breakingChanges = parseField('Breaking Changes');
            const breakingDetails = parseField('Breaking Change Details');
            
            // For fixes, get additional info
            const rootCause = parseField('Root Cause');
            const fixDescription = parseField('Fix Description');
            
            // For chores, get chore type
            const choreType = parseField('Chore Type');
            const userImpact = parseField('User Impact');
            
            // Validate required fields
            if (!description || !changelog || !version) {
              const missing = [];
              if (!description) missing.push('Description');
              if (!changelog) missing.push('Changelog Entry');
              if (!version) missing.push('Semantic Version');
              
              core.setFailed(`Missing required fields: ${missing.join(', ')}`);
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ❌ Missing Required Information\n\nPlease edit your issue to include:\n${missing.map(f => `- **${f}**`).join('\n')}\n\nUse the issue template as a guide.`
              });
              return;
            }
            
            // Validate semantic version format
            const semverRegex = /^\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?(\+[a-zA-Z0-9.-]+)?$/;
            if (!semverRegex.test(version)) {
              core.setFailed('Invalid semantic version format');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ❌ Invalid Version Format\n\nThe version "${version}" is not a valid semantic version.\nPlease use the format: MAJOR.MINOR.PATCH (e.g., 1.2.3)`
              });
              return;
            }
            
            // Output all parsed data
            core.setOutput('description', description);
            core.setOutput('changelog', changelog);
            core.setOutput('version', version);
            core.setOutput('testing', testing);
            core.setOutput('breaking_changes', breakingChanges);
            core.setOutput('breaking_details', breakingDetails);
            core.setOutput('root_cause', rootCause);
            core.setOutput('fix_description', fixDescription);
            core.setOutput('chore_type', choreType);
            core.setOutput('user_impact', userImpact);
            core.setOutput('author', issue.user.login);
            
            console.log('Parsed data:', {
              submissionType,
              description,
              changelog,
              version,
              testing
            });
      
      - name: Get Current Version
        id: current
        run: |
          # Try to get version from package.json
          if [ -f "package.json" ]; then
            CURRENT_VERSION=$(node -p "require('./package.json').version")
          else
            CURRENT_VERSION="0.0.0"
          fi
          
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
      
      - name: Validate Version Bump
        id: validate
        run: |
          CURRENT="${{ steps.current.outputs.current_version }}"
          NEW="${{ steps.parse.outputs.version }}"
          TYPE="${{ steps.parse.outputs.submission_type }}"
          
          # Parse versions
          IFS='.' read -ra CURRENT_PARTS <<< "$CURRENT"
          IFS='.' read -ra NEW_PARTS <<< "$NEW"
          
          CURRENT_MAJOR=${CURRENT_PARTS[0]}
          CURRENT_MINOR=${CURRENT_PARTS[1]}
          CURRENT_PATCH=${CURRENT_PARTS[2]%%[-+]*}
          
          NEW_MAJOR=${NEW_PARTS[0]}
          NEW_MINOR=${NEW_PARTS[1]}
          NEW_PATCH=${NEW_PARTS[2]%%[-+]*}
          
          # Validate version bump based on type
          VALID=true
          MESSAGE=""
          
          if [ "$TYPE" = "fix" ] || [ "$TYPE" = "chore" ]; then
            # For fixes and chores, typically patch bump
            if [ "$NEW_MAJOR" -gt "$CURRENT_MAJOR" ] || [ "$NEW_MINOR" -gt "$CURRENT_MINOR" ]; then
              MESSAGE="✅ Version bump valid (but larger than typical for $TYPE)"
            elif [ "$NEW_PATCH" -gt "$CURRENT_PATCH" ] && [ "$NEW_MAJOR" -eq "$CURRENT_MAJOR" ] && [ "$NEW_MINOR" -eq "$CURRENT_MINOR" ]; then
              MESSAGE="✅ Version bump valid (patch release)"
            else
              VALID=false
              MESSAGE="❌ Invalid version bump. For $TYPE, expected patch bump from $CURRENT"
            fi
          elif [ "$TYPE" = "feature" ]; then
            # For features, typically minor bump (or major if breaking)
            BREAKING="${{ steps.parse.outputs.breaking_changes }}"
            if [ "$BREAKING" = "Yes" ] && [ "$NEW_MAJOR" -gt "$CURRENT_MAJOR" ]; then
              MESSAGE="✅ Version bump valid (major release with breaking changes)"
            elif [ "$NEW_MINOR" -gt "$CURRENT_MINOR" ] && [ "$NEW_MAJOR" -eq "$CURRENT_MAJOR" ]; then
              MESSAGE="✅ Version bump valid (minor release)"
            elif [ "$NEW_PATCH" -gt "$CURRENT_PATCH" ] && [ "$NEW_MAJOR" -eq "$CURRENT_MAJOR" ] && [ "$NEW_MINOR" -eq "$CURRENT_MINOR" ]; then
              MESSAGE="✅ Version bump valid (patch release for feature)"
            else
              VALID=false
              if [ "$BREAKING" = "Yes" ]; then
                MESSAGE="❌ Invalid version bump. Breaking changes require major version bump from $CURRENT"
              else
                MESSAGE="❌ Invalid version bump. Features typically require minor version bump from $CURRENT"
              fi
            fi
          fi
          
          echo "valid=$VALID" >> $GITHUB_OUTPUT
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT
          
          if [ "$VALID" = "false" ]; then
            echo "::error::$MESSAGE"
            exit 1
          fi
      
      - name: Create Feature Branch
        if: success()
        id: branch
        run: |
          TYPE="${{ steps.parse.outputs.submission_type }}"
          VERSION="${{ steps.parse.outputs.version }}"
          AUTHOR="${{ steps.parse.outputs.author }}"
          
          # Create branch name
          BRANCH="$TYPE/$VERSION-by-$AUTHOR"
          
          # Configure git
          git config user.name "Clanker Bot"
          git config user.email "bot@clanker.dev"
          
          # Check if branch already exists on remote
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "⚠️ Branch $BRANCH already exists on remote, fetching and resetting..."
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            
            # Pull latest changes from main
            git pull origin main --no-edit
          else
            # Create new branch from main
            git checkout -b "$BRANCH"
          fi
          
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Created/updated branch: $BRANCH"
      
      - name: Update Files
        if: success()
        id: update
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          CHANGELOG="${{ steps.parse.outputs.changelog }}"
          TYPE="${{ steps.parse.outputs.submission_type }}"
          
          # Update package.json if it exists
          if [ -f "package.json" ]; then
            # Update version in package.json
            node -e "
              const pkg = require('./package.json');
              pkg.version = '$VERSION';
              require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
            "
            echo "✅ Updated package.json"
          fi
          
          # Update or create CHANGELOG.md
          if [ ! -f "CHANGELOG.md" ]; then
            cat > CHANGELOG.md << 'EOF'
          # Changelog
          
          All notable changes to Clanker will be documented in this file.
          
          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
          and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
          
          EOF
          fi
          
          # Prepare changelog entry
          DATE=$(date +%Y-%m-%d)
          SECTION=""
          
          case "$TYPE" in
            feature)
              SECTION="Added"
              ;;
            fix)
              SECTION="Fixed"
              ;;
            chore)
              SECTION="Changed"
              ;;
          esac
          
          # Add new version section to changelog
          TEMP_FILE=$(mktemp)
          
          # Check if version already exists
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "Version $VERSION already in changelog, updating..."
            # Update existing version section
            awk -v version="$VERSION" -v section="$SECTION" -v changelog="$CHANGELOG" '
              /^## \['"$VERSION"'\]/ { in_version=1 }
              /^## \[/ && !/^## \['"$VERSION"'\]/ { in_version=0 }
              { print }
              in_version && /^### '"$SECTION"'$/ { 
                print changelog
                found=1
              }
              END {
                if (in_version && !found) {
                  print "\n### " section "\n" changelog
                }
              }
            ' CHANGELOG.md > "$TEMP_FILE"
          else
            # Add new version section
            awk -v version="$VERSION" -v date="$DATE" -v section="$SECTION" -v changelog="$CHANGELOG" '
              /^## \[/ && !done {
                print "## [" version "] - " date "\n\n### " section "\n" changelog "\n"
                done=1
              }
              { print }
              END {
                if (!done) {
                  print "## [" version "] - " date "\n\n### " section "\n" changelog
                }
              }
            ' CHANGELOG.md > "$TEMP_FILE"
          fi
          
          mv "$TEMP_FILE" CHANGELOG.md
          echo "✅ Updated CHANGELOG.md"
          
          # Update VERSION file if it exists or create it
          echo "$VERSION" > VERSION
          echo "✅ Updated VERSION file"
      
      - name: Commit Changes
        if: success()
        id: commit
        run: |
          # Check if there are changes to commit
          if git diff --staged --quiet && git diff --quiet; then
            echo "No changes to commit, checking if we need to force push existing commits..."
            NEEDS_PUSH=false
            
            # Check if local branch is ahead of remote
            LOCAL_COMMIT=$(git rev-parse HEAD)
            REMOTE_COMMIT=$(git rev-parse origin/"${{ steps.branch.outputs.branch }}" 2>/dev/null || echo "none")
            
            if [ "$LOCAL_COMMIT" != "$REMOTE_COMMIT" ]; then
              echo "Local branch has commits that need to be pushed"
              NEEDS_PUSH=true
            fi
          else
            # Stage and commit changes
            git add -A
            git commit -m "${{ steps.parse.outputs.submission_type }}: version ${{ steps.parse.outputs.version }}
          
          ${{ steps.parse.outputs.changelog }}
          
          Submitted by @${{ steps.parse.outputs.author }} via issue #${{ github.event.issue.number }}"
            NEEDS_PUSH=true
          fi
          
          # Push changes
          if [ "$NEEDS_PUSH" = "true" ]; then
            # Try regular push first
            if ! git push origin "${{ steps.branch.outputs.branch }}"; then
              echo "⚠️ Regular push failed, attempting to pull and retry..."
              
              # Pull with rebase to get latest changes
              git pull origin "${{ steps.branch.outputs.branch }}" --rebase
              
              # Try push again
              if ! git push origin "${{ steps.branch.outputs.branch }}"; then
                echo "❌ Push failed even after pull. This might require manual intervention."
                echo "push_failed=true" >> $GITHUB_OUTPUT
                exit 1
              fi
            fi
            
            echo "✅ Successfully pushed changes"
            echo "push_failed=false" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No new changes to push"
            echo "push_failed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Trigger PR Creation Workflow
        if: success()
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              // Trigger the PR creation workflow
              const result = await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'create-clanker-pr.yml',
                ref: 'main',
                inputs: {
                  branch: '${{ steps.branch.outputs.branch }}',
                  submission_type: '${{ steps.parse.outputs.submission_type }}',
                  version: '${{ steps.parse.outputs.version }}',
                  author: '${{ steps.parse.outputs.author }}',
                  issue_number: '${{ github.event.issue.number }}',
                  description: `${{ steps.parse.outputs.description }}`.substring(0, 1000),
                  changelog: `${{ steps.parse.outputs.changelog }}`.substring(0, 1000),
                  testing: `${{ steps.parse.outputs.testing }}`.substring(0, 1000),
                  current_version: '${{ steps.current.outputs.current_version }}',
                  breaking_changes: '${{ steps.parse.outputs.breaking_changes }}' || 'No',
                  breaking_details: `${{ steps.parse.outputs.breaking_details }}`.substring(0, 1000) || '',
                  root_cause: `${{ steps.parse.outputs.root_cause }}`.substring(0, 1000) || '',
                  fix_description: `${{ steps.parse.outputs.fix_description }}`.substring(0, 1000) || '',
                  chore_type: '${{ steps.parse.outputs.chore_type }}' || '',
                  user_impact: '${{ steps.parse.outputs.user_impact }}' || ''
                }
              });
              
              console.log('✅ PR creation workflow triggered successfully');
              core.setOutput('workflow_triggered', 'true');
              core.setOutput('pr_url', `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`);
            } catch (error) {
              console.log('⚠️ Could not trigger PR workflow:', error.message);
              console.log('This may be due to missing BOT_TOKEN secret.');
              core.setOutput('workflow_triggered', 'false');
              core.setOutput('pr_url', '');
            }
      
      - name: Comment on Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const workflowTriggered = '${{ steps.pr.outputs.workflow_triggered }}' === 'true';
            const pushFailed = '${{ steps.commit.outputs.push_failed }}' === 'true';
            const success = workflowTriggered || ${{ steps.pr.outcome == 'success' }};
            
            let comment = '';
            
            if (success) {
              comment = `## ✅ Submission Processed Successfully!\n\n`;
              comment += `### 📦 Submission Details\n`;
              comment += `- **Type**: ${{ steps.parse.outputs.submission_type }}\n`;
              comment += `- **Version**: ${{ steps.parse.outputs.version }}\n`;
              comment += `- **Author**: @${{ steps.parse.outputs.author }}\n\n`;
              
              comment += `### 📊 Pipeline Status\n`;
              comment += `- ✅ Issue parsed successfully\n`;
              comment += `- ✅ Version validated\n`;
              comment += `- ✅ Branch created: \`${{ steps.branch.outputs.branch }}\`\n`;
              comment += `- ✅ Files updated\n`;
              comment += `- ✅ Pull request created\n\n`;
              
              if (workflowTriggered) {
                comment += `### 🔗 Pull Request\n`;
                comment += `A separate workflow has been triggered to create the pull request.\n`;
                comment += `Check the [Actions tab](${{ steps.pr.outputs.pr_url }}) for the PR creation status.\n\n`;
                comment += `> ℹ️ **Note**: The PR will be created in a few moments by the automated workflow.\n\n`;
              } else {
                comment += `### 🔗 Pull Request\n`;
                comment += `${{ steps.pr.outputs.pr_url || 'Manual PR creation required' }}\n\n`;
              }
              
              comment += `### 🎯 Next Steps\n`;
              comment += `1. The PR will be reviewed by maintainers\n`;
              comment += `2. CI/CD checks will run automatically\n`;
              comment += `3. Once approved and merged, a release will be created\n`;
              comment += `4. The new version will be available for users\n\n`;
              
              comment += `Thank you for your contribution! 🙏`;
              
              // Close the issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
              
            } else {
              comment = `## ❌ Submission Processing Failed\n\n`;
              
              const parseSuccess = ${{ steps.parse.outcome == 'success' }};
              const validateSuccess = ${{ steps.validate.outcome == 'success' }};
              const branchSuccess = ${{ steps.branch.outcome == 'success' }};
              const updateSuccess = ${{ steps.update.outcome == 'success' }};
              const commitSuccess = ${{ steps.commit.outcome == 'success' }};
              
              comment += `### 📊 Pipeline Status\n`;
              comment += `- ${parseSuccess ? '✅' : '❌'} Issue parsing\n`;
              comment += `- ${validateSuccess ? '✅' : '❌'} Version validation\n`;
              comment += `- ${branchSuccess ? '✅' : '❌'} Branch creation\n`;
              comment += `- ${updateSuccess ? '✅' : '❌'} File updates\n`;
              comment += `- ${commitSuccess && !pushFailed ? '✅' : '❌'} Commit & push\n`;
              comment += `- ${success ? '✅' : '❌'} Pull request creation\n`;
              
              if (!parseSuccess) {
                comment += `\n### ❌ Parsing Error\n`;
                comment += `Please ensure all required fields are filled correctly.\n`;
              } else if (!validateSuccess) {
                comment += `\n### ❌ Version Validation Error\n`;
                comment += `${{ steps.validate.outputs.message }}\n`;
              } else if (pushFailed) {
                comment += `\n### ⚠️ Git Push Failed\n`;
                comment += `The workflow encountered a conflict when pushing changes. This can happen when:\n`;
                comment += `- The branch was modified externally\n`;
                comment += `- Multiple submissions are being processed simultaneously\n`;
                comment += `- The repository was updated after the workflow started\n\n`;
                comment += `**The workflow attempted to automatically resolve this but failed.**\n\n`;
                comment += `### 🔧 How to Fix\n`;
                comment += `1. **Option 1**: Close this issue and create a new one with the same information\n`;
                comment += `2. **Option 2**: Delete the branch \`${{ steps.branch.outputs.branch }}\` and edit this issue to trigger the workflow again\n`;
                comment += `3. **Option 3**: Manually resolve the conflicts in the branch and create a PR\n\n`;
                comment += `To delete the branch:\n`;
                comment += `\`\`\`bash\n`;
                comment += `git push origin --delete ${{ steps.branch.outputs.branch }}\n`;
                comment += `\`\`\`\n`;
              } else if (!commitSuccess) {
                comment += `\n### ❌ Commit Failed\n`;
                comment += `Failed to commit changes. Check the workflow logs for details.\n`;
              } else if (!success) {
                comment += `\n### ⚠️ Pull Request Creation\n`;
                if (!workflowTriggered) {
                  comment += `The automated PR workflow could not be triggered. This usually means the BOT_TOKEN secret is not configured.\n\n`;
                  comment += `### 🔧 Manual PR Creation Required\n`;
                  comment += `You can create the PR manually using:\n`;
                  comment += `\`\`\`bash\n`;
                  comment += `gh pr create \\\n`;
                  comment += `  --repo zigglers/clanker \\\n`;
                  comment += `  --base main \\\n`;
                  comment += `  --head ${{ steps.branch.outputs.branch }} \\\n`;
                  comment += `  --title "${{ steps.parse.outputs.submission_type }}: ${{ steps.parse.outputs.version }}" \\\n`;
                  comment += `  --body "Closes #${{ github.event.issue.number }}"\n`;
                  comment += `\`\`\`\n`;
                } else {
                  comment += `The PR could not be created. Check the workflow logs for details.\n`;
                }
              }
              
              comment += `\n### 📝 Action Required\n`;
              comment += `Please review the error above and take the suggested action. `;
              comment += `If the issue persists, you may need to create the PR manually or contact a maintainer.\n\n`;
              comment += `**Branch**: \`${{ steps.branch.outputs.branch }}\``;
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });