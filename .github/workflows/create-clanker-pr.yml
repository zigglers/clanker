name: Create Clanker PR

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name'
        required: true
      submission_type:
        description: 'Submission type (feature/fix/chore)'
        required: true
      version:
        description: 'Version'
        required: true
      issue_number:
        description: 'Source issue number'
        required: true
      current_version:
        description: 'Current version'
        required: true
      pr_data:
        description: 'PR data as JSON (description, changelog, testing, author)'
        required: true
      optional_data:
        description: 'Optional data as JSON (breaking_changes, chore_type, etc)'
        required: false
        default: '{}'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      
      - name: Parse Input Data
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            // Parse PR data
            let prData = {};
            let optionalData = {};
            
            try {
              prData = JSON.parse(`${{ inputs.pr_data }}`);
            } catch (e) {
              console.log('Failed to parse pr_data:', e);
              prData = {
                description: 'No description provided',
                changelog: 'See issue for details',
                testing: 'See issue for details',
                author: 'unknown'
              };
            }
            
            try {
              optionalData = JSON.parse(`${{ inputs.optional_data }}`);
            } catch (e) {
              console.log('Failed to parse optional_data:', e);
              optionalData = {};
            }
            
            // Set outputs
            core.setOutput('description', prData.description || '');
            core.setOutput('changelog', prData.changelog || '');
            core.setOutput('testing', prData.testing || '');
            core.setOutput('author', prData.author || 'unknown');
            core.setOutput('breaking_changes', optionalData.breaking_changes || 'No');
            core.setOutput('breaking_details', optionalData.breaking_details || '');
            core.setOutput('root_cause', optionalData.root_cause || '');
            core.setOutput('fix_description', optionalData.fix_description || '');
            core.setOutput('chore_type', optionalData.chore_type || '');
            core.setOutput('user_impact', optionalData.user_impact || '');
      
      - name: Create Pull Request
        run: |
          TYPE="${{ inputs.submission_type }}"
          VERSION="${{ inputs.version }}"
          BRANCH="${{ inputs.branch }}"
          
          # Determine emoji based on type
          case "$TYPE" in
            feature)
              EMOJI="🚀"
              ;;
            fix)
              EMOJI="🐛"
              ;;
            chore)
              EMOJI="🔧"
              ;;
          esac
          
          # Create PR body
          cat > pr-body.md << EOF
          ## $EMOJI Automated $TYPE Submission
          
          This PR was automatically generated from issue #${{ inputs.issue_number }}.
          
          ### 📋 Summary
          ${{ steps.parse.outputs.description }}
          
          ### 📝 Changelog
          ${{ steps.parse.outputs.changelog }}
          
          ### 🏷️ Version
          **${{ inputs.current_version }}** → **${{ inputs.version }}**
          
          EOF
          
          # Add type-specific sections
          if [ "$TYPE" = "feature" ]; then
            if [ "${{ steps.parse.outputs.breaking_changes }}" = "Yes" ]; then
              cat >> pr-body.md << EOF
          ### ⚠️ Breaking Changes
          ${{ steps.parse.outputs.breaking_details }}
          
          EOF
            fi
          elif [ "$TYPE" = "fix" ]; then
            if [ -n "${{ steps.parse.outputs.root_cause }}" ]; then
              cat >> pr-body.md << EOF
          ### 🔍 Root Cause
          ${{ steps.parse.outputs.root_cause }}
          
          ### ✅ Fix Details
          ${{ steps.parse.outputs.fix_description }}
          
          EOF
            fi
          elif [ "$TYPE" = "chore" ]; then
            if [ -n "${{ steps.parse.outputs.chore_type }}" ]; then
              cat >> pr-body.md << EOF
          ### 🔧 Chore Type
          ${{ steps.parse.outputs.chore_type }}
          
          ### 👥 User Impact
          ${{ steps.parse.outputs.user_impact }}
          
          EOF
            fi
          fi
          
          # Add testing section
          cat >> pr-body.md << EOF
          ### 🧪 Testing
          ${{ steps.parse.outputs.testing }}
          
          ### 📊 Validation
          - ✅ Semantic version validated
          - ✅ Changelog updated
          - ✅ Version files updated
          
          Closes #${{ inputs.issue_number }}
          EOF
          
          # Create PR
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$EMOJI $TYPE: $VERSION" \
            --body-file pr-body.md \
            --label "clanker-$TYPE")
          
          echo "Created PR: $PR_URL"
          
          # Post comment on issue
          gh issue comment ${{ inputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "## 🎉 Pull Request Created!
          
          The automated PR has been successfully created: $PR_URL
          
          The PR will now go through review and CI/CD checks."
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}